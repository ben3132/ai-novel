# 仅实现在线/本地 L1 (trust_level=1) 与 L1-derived (trust_level=11) 原始获取。
# L2/L3/L4 网页采集器已经注册；L2/L3 可按等级归档检索，L4 只能作为线索且禁止推理。
#
# L1-derived 强制规则：trust_level 固定为 11，且输出 extra_meta.note 固定写明
# “第三方转录副本，必须L1原件交叉验证”。不得把 Wiki 当作 L1-derived。
# 本项目仅用于本地考据研究；不得公开分发抓取到的版权内容。

http_defaults: &http_defaults
  timeout: 30
  retries: 3
  backoff_factor: 0.8
  delay_seconds: 1.0
  headers:
    User-Agent: "IP-Source-L1-Collector/1.1 (local research; respect robots.txt and terms)"

source_meta_defaults: &source_meta_defaults
  authenticity_status: verified
  continuity: unknown
  work_title: unknown
  work_version: unknown
  canon_scope: unknown
  content_status: official_reference
  completeness: partial
  language: unknown
  original_language: unknown
  translation_status: original
  published_ts: null
  effective_from: null
  effective_to: null
  supersedes_source_id: null
  evidence_status: direct

# 公开媒体字幕任务模板（不是可执行任务）。填写具体官方视频 URL 后再复制到 tasks。
media_task_templates:
  official_subtitle_l1:
    collector: official_media_subtitle_l1
    trust_level: 1
    download_video: false
    noplaylist: true
    media:
      official_channel_asserted: true
      subtitle_origin: official
      include_automatic_captions: false
      languages: ["en", "zh-Hans"]
      preferred_formats: ["vtt", "srt", "ttml", "json3"]
      download_all_formats: false
  automatic_or_third_party_subtitle:
    collector: derived_media_subtitle
    trust_level: 11
    download_video: false
    noplaylist: true
    media:
      subtitle_origin: third_party_or_automatic
      include_automatic_captions: true
      languages: ["en", "zh-Hans"]
      preferred_formats: ["vtt", "srt", "ttml", "json3"]
      download_all_formats: false

# 只作人工来源索引；不会自动运行。
# Wiki 不按域名自动定级：有可核验引用规范时可评 L2，否则按 L3；不得标记为 L1/11。
official_reference_urls:
  douluo: "https://www.qidian.com/book/1115277/"
  naruto: "https://naruto-official.com/"
  lol_cn: "https://yz.lol.qq.com/"
  lol_global: "https://universe.leagueoflegends.com/en-US/"
  transformers: "https://www.transformers.com/"
  transformers_pulse: "https://www.hasbropulse.com/collections/transformers"
  ben10_warner: "https://www.warnerbros.com/tv/ben-10-classic-complete-collection"
  ben10_creator_document: "https://dwaynemcduffie.com/wp-content/uploads/2024/07/WEBSITE-B10Hero-Generation-SERIES-BIBLE-by-Dwayne.pdf"
  kungfu_panda: "https://www.dreamworks.com/movies/kung-fu-panda"
  jackie_chan_cn: "https://shaoer.cntv.cn/program/cllxj/"
  # 希腊神话没有现代版权方官网。Theoi/Wikisource 是第三方整理/转录，不标 L1；
  # Perseus 的具体版本化原文或扫描件需逐项核验，不能把门户首页直接当作原典 L1。
  myth_athena: null

