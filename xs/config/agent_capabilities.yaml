schema_version: 3
role: agent_guided_evidence_toolkit
embedded_llm_required: false
agent_owns:
  - interpret_research_goal
  - discover_work_tree_and_continuities
  - discover_dynamic_sources
  - verify_publisher_and_propose_trust
  - choose_collector
  - decide_when_coverage_is_sufficient
implemented_agent_operations:
  - get_agent_guidance
  - initialize_ip
  - get_research_state
  - get_research_status
  - register_work
  - register_source
  - update_source_status
  - save_claim_candidate
  - next_actions
  - list_works
  - get_corpus_status
  - get_entity
  - search_evidence
  - search_hybrid
cli_commands:
  collect: run_l1_collect.py
  extract_pdf_pages: run_extract_pdf.py
  segment: run_process.py
  build_windows: run_build_windows.py
  build_database: run_build_index.py
  build_vector_index: build_ip_vector_index.py
agent_tasks_not_api_operations:
  - discover_work_tree
  - discover_sources
  - choose_collector
  - cross_check_l1
  - assess_coverage_and_gaps
not_implemented:
  - automatic_web_source_discovery
  - automatic_work_tree_discovery
  - single_command_end_to_end_pipeline
  - coverage_report_operation
  - autonomous_research_loop
  - pdf_page_ocr_fallback
  - structured_xml_fdx_extraction
next_actions_semantics: advisory_not_callable_operations
pause_only_for:
  - missing_credentials_or_user_files
  - paid_access
  - captcha_or_login_intervention
  - destructive_action
  - access_control_or_copyright_bypass
  - material_scope_choice
data_policy:
  code_and_data_separate: true
  layout: data/ip/<ip_domain>/{raw,processed}
  model_memory_is_evidence: false
  l4_eligible_for_reasoning: false
completion_policy:
  pipeline_complete_is_not_ip_complete: true
  source_count_field: source_artifact_count
  required_coverage_dimensions: [work_tree, continuity, source_type, unresolved_gaps]
